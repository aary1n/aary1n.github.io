# Site-wide settings.
# Anything written as [PLACEHOLDER ...] is highlighted on the page until replaced.

name = "aaryan sharif"
title = "aaryans.page"
url = "https://aaryans.page"   # used for share links and preview cards
description = "i'm a third year materials student and researcher at imperial."

# Sections that show the "you're early!" page instead of their content: while you're moving things in, or fixing
# something. Any of "blog", "flowers"; [] opens everything. The words on that page are in content/building.md.
building = ["blog"]

# Drawings used for butterflies. Swap in scanned PNGs from tools/process_drawing.py (put them in static/img/).
butterflies = ["/assets/img/butterfly-1.svg", "/assets/img/butterfly-2.svg"]

